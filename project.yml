name: BabyTimeline
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # 打开 Xcode 后自己填 Apple ID 对应的 Team
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  BabyTimeline:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BabyTimeline
    resources:
      - path: BabyTimeline/Assets.xcassets
    info:
      path: BabyTimeline/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.babytimeline
        INFOPLIST_FILE: BabyTimeline/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone + iPad
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
