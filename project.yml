name: BabyTimeline
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # 打开 Xcode 后自己填 Apple ID 对应的 Team
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  BabyTimeline:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BabyTimeline
        excludes:
          - "Info.plist"
    resources:
      - path: BabyTimeline/Assets.xcassets
    # XcodeGen 会按下面的 properties 生成 BabyTimeline/Info.plist。
    # 不要在 properties 之外手改那个文件——每次 xcodegen 会覆盖。
    info:
      path: BabyTimeline/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleDisplayName: 苹果长大了
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: >-
          需要访问你的相册，用来自动整理宝宝的成长照片，生成一条时间线。照片不会离开你的手机。
        NSPhotoLibraryAddUsageDescription: >-
          用来把宝宝的照片保留在相册里，App 不会修改任何已有照片。
        NSLocationWhenInUseUsageDescription: >-
          用来把照片里的 GPS 信息转换成可读的地点名称，便于回忆。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.babytimeline
        INFOPLIST_FILE: BabyTimeline/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone + iPad
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  BabyTimelineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BabyTimelineTests
    dependencies:
      - target: BabyTimeline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.babytimeline.tests
        GENERATE_INFOPLIST_FILE: YES
